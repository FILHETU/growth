:root{
  --ink:#FFFFFF; --soft:#ACACD3; --accent:#8C8CE6; --night:#13121B; --pillbg:rgba(14,14,21,.85); --pillink:#12121A;

  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;

.page{position:relative;z-index:1;box-sizing:border-box;min-height:100vh;padding-inline:max(16px,7vw);padding-block:clamp(32px,8vw,56px) 40px;
  display:grid;gap:clamp(24px,5vw,36px);align-content:center;justify-items:center}
.viewer{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:18px}
.toggle{display:flex;gap:14px}
.toggle button{font:600 13px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;padding:11px 20px;border-radius:999px;border:0;cursor:pointer;
  background:var(--pillbg);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:background .25s,color .25s}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--pillink);box-shadow:none}
.toggle button:focus-visible,.handle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.stage{position:relative;width:100%;aspect-ratio:593/847;max-width:100%;border-radius:clamp(18px,4.6vw,30px);overflow:hidden;cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 100px -28px rgba(0,0,0,.8),0 0 110px -18px rgba(122,122,184,.35);background:#1F1D2B}
.layer{position:absolute;inset:0;overflow:hidden}
.scaler{position:absolute;left:0;top:0;width:593px;height:847px;transform-origin:0 0}
.before{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.before .scaler{filter:none}
.line{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:var(--ink);pointer-events:none}
.handle{position:absolute;top:50%;left:var(--p);width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:0;padding:0;background:var(--ink);cursor:ew-resize;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.4);transition:transform .2s}
.stage.drag .handle{transform:scale(1.08)}
.hint{margin:0;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--soft);opacity:.75}
.foot{padding-top:4px;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vw,16px);text-align:center}
.tag{margin:0;font-size:clamp(16px,3.9vw,22px);line-height:1.5;font-weight:500;color:var(--soft);max-width:30ch;text-wrap:balance}
.foot svg{height:clamp(30px,7vw,38px);width:auto;display:block}
@media (min-width:960px){
  .page{min-height:100vh;align-content:center;padding-block:40px}
  .viewer{width:min(480px,calc((100vh - 336px)*593/847))}
}
@media (prefers-reduced-motion:reduce){.handle,.toggle button{transition:none}}
</style>

<script>
(function(){
  const stage=document.getElementById('stage'), handle=document.getElementById('handle');
  const bB=document.getElementById('bBefore'), bA=document.getElementById('bAfter');
  const sB=document.getElementById('sBefore'), sA=document.getElementById('sAfter');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let p=50, anim=null, touched=false;

  function set(v){ p=Math.max(0,Math.min(100,v)); stage.style.setProperty('--p',p+'%');
    handle.setAttribute('aria-valuenow',Math.round(p)); handle.setAttribute('aria-valuetext',Math.round(p)+'% before');
    const beforeOn=p>50; bB.setAttribute('aria-pressed',beforeOn); bA.setAttribute('aria-pressed',!beforeOn); }
  const ease=x=>x*x*x*(10-15*x+6*x*x);
  function tween(to,ms,done){ cancelAnimationFrame(anim); if(reduce||ms<=0){ set(to); done&&done(); return; }
    const from=p, t0=performance.now();
    const step=now=>{ const k=Math.min(1,(now-t0)/ms); set(from+(to-from)*ease(k)); if(k<1) anim=requestAnimationFrame(step); else done&&done(); };
    anim=requestAnimationFrame(step); }
  function stop(){ touched=true; cancelAnimationFrame(anim); }

  function fit(){ const s=stage.clientWidth/593; sB.style.transform=sA.style.transform=`scale(${s})`; }
  new ResizeObserver(fit).observe(stage);

  const posFrom=e=>{ const r=stage.getBoundingClientRect(); return (e.clientX-r.left)/r.width*100; };
  stage.addEventListener('pointerdown',e=>{ if(e.button>0) return; stop(); stage.setPointerCapture(e.pointerId); stage.classList.add('drag'); set(posFrom(e)); });
  stage.addEventListener('pointermove',e=>{ if(stage.hasPointerCapture(e.pointerId)) set(posFrom(e)); });
  const end=e=>{ stage.classList.remove('drag'); };
  stage.addEventListener('pointerup',end); stage.addEventListener('pointercancel',end);
  handle.addEventListener('keydown',e=>{ const k=e.key, d=e.shiftKey?10:2;
    if(k==='ArrowLeft'||k==='ArrowDown'){ stop(); set(p-d); e.preventDefault(); }
    else if(k==='ArrowRight'||k==='ArrowUp'){ stop(); set(p+d); e.preventDefault(); }
    else if(k==='Home'){ stop(); tween(0,500); e.preventDefault(); }
    else if(k==='End'){ stop(); tween(100,500); e.preventDefault(); } });
  bB.addEventListener('click',()=>{ stop(); tween(100,700); });
  bA.addEventListener('click',()=>{ stop(); tween(0,700); });

  // build the two in-app cards (live DOM, so they stay sharp at any zoom)
  const old=card('old','portfolio'), neu=card('new','portfolio');
  sB.appendChild(old.root); sA.appendChild(neu.root);
  document.getElementById('logo').innerHTML=LOGO(38);
  set(50); fit();
  Promise.all([400,500,600,700].map(w=>document.fonts.load(w+' 16px Mont'))).then(()=>{ old.fit(); neu.fit(); fit();
    // one gentle sweep so people see it moves; any touch cancels it
    if(!reduce) setTimeout(()=>{ if(touched) return; tween(72,650,()=>{ if(!touched) tween(28,900,()=>{ if(!touched) tween(50,650); }); }); },700);
  });
})();
